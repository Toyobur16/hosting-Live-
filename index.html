<!doctype html>
<html lang="en" class="dark" style="background-color: #0a0e1a; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bot-Host</title>
    <meta name="description" content="Free 24/7 unlimited cloud hosting platform for Telegram bots and Python scripts with user registration, authentication, isolated bot workspaces, file deletion, live console, and auto-restart watchdog." />
    <meta property="og:title" content="Bot-Host" />
    <meta property="og:description" content="Free 24/7 unlimited cloud hosting platform for Telegram bots and Python scripts with user registration, authentication, isolated bot workspaces, file deletion, live console, and auto-restart watchdog." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('bot_theme');
          if (t === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8fafc';
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0a0e1a';
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
